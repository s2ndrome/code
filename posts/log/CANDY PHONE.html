<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>송구름의 휴대전화 · 아이기스 쉴드-S 화이트펄</title>
<style>
:root{
  --bg:#f3fafc; --bg2:#e9f6f8; --card:#ffffff; --line:#dcebee;
  --text:#2b3440; --sub:#7d8a96; --dim:#a9b4bd;
  --mint:#6fd6cb; --mint2:#3fbfb2; --sky:#9fd6f6; --pink:#ff86b3; --pink2:#ffc4da; --red:#ff4d6d;
  --sb:40px; --nb:52px;
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif;
  --hand:"Nanum Pen Script","Gaegu","Comic Sans MS",cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#dff1f6;color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0}
.tap,[data-act]{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
[data-act]{transition:transform .12s ease,background-color .15s ease,opacity .15s ease}
[data-act]:active{transform:scale(.95);opacity:.85}

/* ===== 기기 + 글리터 케이스 ===== */
#phone{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;overflow:clip;background:#fff;isolation:isolate}
@media (min-width:520px) and (min-height:720px){
  #phone{width:412px;height:min(880px,94vh);border-radius:46px;border:10px solid transparent;
    background:linear-gradient(#fff,#fff) padding-box,linear-gradient(135deg,#bff3ec,#9fd6f6 35%,#e6f7ff 50%,#8fe3d6 70%,#c7e9ff) border-box;
    box-shadow:0 0 0 2px rgba(255,255,255,.8),0 30px 70px rgba(80,150,170,.35)}
  body:before{content:"";position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(2px 2px at 70% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 80%,#fff,transparent),radial-gradient(2px 2px at 85% 65%,#fff,transparent),radial-gradient(1.5px 1.5px at 12% 70%,#fff,transparent);
    animation:twinkle 2.4s ease-in-out infinite alternate}
}
@keyframes twinkle{from{opacity:.35}to{opacity:1}}

/* 액정 금 + 얼룩 (장식) */
#crack{position:absolute;top:0;left:0;width:120px;height:110px;z-index:93;pointer-events:none;opacity:.75}
#smudge{position:absolute;inset:0;z-index:92;pointer-events:none;
  background:radial-gradient(40px 30px at 70% 62%,rgba(255,220,200,.10),transparent 70%),radial-gradient(30px 24px at 30% 78%,rgba(255,255,255,.12),transparent 70%),radial-gradient(26px 20px at 60% 35%,rgba(255,210,220,.08),transparent 70%)}

/* ===== 상태 표시줄 ===== */
#statusbar{position:absolute;top:0;left:0;right:0;height:var(--sb);z-index:90;display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 24px;font-size:13px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35)}
#statusbar.dark{color:var(--text);text-shadow:none}
#statusbar .sb-ic{display:flex;align-items:center;gap:6px;pointer-events:none}
#statusbar svg{width:15px;height:15px;fill:currentColor}
#statusbar .bat{display:flex;align-items:center;gap:3px;color:var(--red)}
#statusbar .batbox{position:relative;width:23px;height:11px;border:1.5px solid currentColor;border-radius:3px}
#statusbar .batbox i{position:absolute;left:1px;top:1px;bottom:1px;background:var(--red);border-radius:1px}
#statusbar .batbox:after{content:"";position:absolute;right:-4px;top:2.5px;width:2px;height:4px;background:currentColor;border-radius:0 1px 1px 0}
#statusbar .nbadge{background:var(--pink);color:#fff;border-radius:8px;padding:0 5px;font-size:10px;line-height:15px;text-shadow:none}
#sbClock{pointer-events:none}
.punch{position:absolute;top:12px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#111;z-index:91;pointer-events:none}

/* ===== 네비게이션 바 ===== */
#navbar{position:absolute;left:0;right:0;bottom:0;height:var(--nb);z-index:70;display:flex;justify-content:space-around;align-items:center;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(160,210,220,.35)}
#navbar button{width:64px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:14px;color:#5d7380}
#navbar button:active{background:rgba(111,214,203,.18)}
#navbar svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ===== 화면 공통 ===== */
#screens{position:absolute;inset:0;z-index:1;overflow:hidden;overflow:clip}
.screen{position:absolute;inset:0;padding:var(--sb) 0 var(--nb);display:flex;flex-direction:column;background:var(--bg);
  opacity:0;visibility:hidden;pointer-events:none;transform:translateX(26px);
  transition:opacity .22s ease,transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s linear .26s}
.screen.active{opacity:1;visibility:visible;pointer-events:auto;transform:none;
  transition:opacity .22s ease,transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s}
.screen.overlay{background:transparent;transform:translateY(-14px)}
.screen.overlay.active{transform:none}
.appbar{flex:0 0 auto;height:56px;display:flex;align-items:center;gap:4px;padding:0 8px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#f4fdfc,#eef8ff)}
.appbar .ttl{flex:1;min-width:0;font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .ttl small{display:block;font-size:11px;font-weight:500;color:var(--sub);margin-top:1px}
.ibtn{width:44px;height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.ibtn:active{background:rgba(111,214,203,.18)}
.ibtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.content{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.content::-webkit-scrollbar{width:0}
.sec{padding:16px 16px 6px;font-size:12px;font-weight:800;color:var(--mint2);letter-spacing:.02em}
.row{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 16px;width:100%;text-align:left}
.row:active{background:rgba(111,214,203,.1)}
.row .mid{flex:1;min-width:0}
.row .t1{font-size:15px;font-weight:700;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
.row .t2{font-size:12.5px;color:var(--sub);margin-top:2px;line-height:1.4;overflow-wrap:anywhere}
.row .r{flex:0 0 auto;font-size:11.5px;color:var(--sub);text-align:right}
.ava{flex:0 0 auto;width:46px;height:46px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:21px;background:#e6f1f4;color:#4b5b66;overflow:hidden}
.ava.mint{background:linear-gradient(145deg,#d6faf5,#8fe3d6)}
.ava.pink{background:linear-gradient(145deg,#ffe3ee,#ffb3cf)}
.ava.gray{background:#b9bec6;color:#e9ebef}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:800}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;background:#e8f4f6;color:#4b6470}
.chip.pink{background:#ffe6f0;color:#d64a83}
.chip.mint{background:#dcf7f3;color:#22998d}
.card{margin:10px 14px;padding:14px;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:0 4px 14px rgba(120,180,190,.08)}
.empty{padding:28px 20px;text-align:center;color:var(--sub);font-size:13px;line-height:1.6}
.tabs{flex:0 0 auto;display:flex;border-bottom:1px solid var(--line);background:#fff}
.tabs button{flex:1;min-height:46px;font-size:14px;font-weight:700;color:var(--sub);border-bottom:2.5px solid transparent}
.tabs button.on{color:var(--mint2);border-color:var(--mint2)}
.pane{display:none}
.pane.on{display:block}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--sub);flex:0 0 auto}
.kv span:last-child{text-align:right;overflow-wrap:anywhere;word-break:keep-all}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:16px;background:linear-gradient(135deg,#8fe3d6,#9fd6f6);color:#14454a;font-size:13.5px;font-weight:800}
.btn.full{width:100%}
.btn.ghost{background:#eef6f8;color:var(--text)}
.bar{height:8px;border-radius:4px;background:#e3eef1;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--pink))}

/* ===== 잠금화면 ===== */
#lock{position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;overflow:hidden;transition:opacity .35s ease,visibility 0s linear 0s;
  background:radial-gradient(60% 40% at 30% 62%,rgba(255,255,255,.65),transparent 70%),radial-gradient(50% 35% at 75% 70%,rgba(255,200,220,.55),transparent 70%),linear-gradient(170deg,#c9e9f2,#f3e6ee 55%,#fde8d8)}
#lock.hidden{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .35s ease,visibility 0s linear .35s}
#lock .lk-clock{margin-top:calc(var(--sb) + 34px);text-align:center;color:#fff;text-shadow:0 2px 12px rgba(40,90,110,.55);pointer-events:none}
#lock .lk-clock b{display:block;font-size:clamp(58px,19vw,80px);font-weight:300;letter-spacing:-2px;line-height:1}
#lock .lk-clock span{font-size:14px;font-weight:600}
.sleep{position:relative;margin-top:22px;width:250px;max-width:70vw;height:170px;pointer-events:none}
.sleep .doll{position:absolute;font-size:46px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.12))}
.sleep .face{position:absolute;left:50%;top:44%;width:84px;height:84px;margin-left:-42px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#ffe9dc,#f6cdb9);box-shadow:0 0 0 10px rgba(143,227,214,.55)}
.sleep .face:before,.sleep .face:after{content:"";position:absolute;top:40%;width:16px;height:6px;border-bottom:2.5px solid #6b4b45;border-radius:0 0 10px 10px}
.sleep .face:before{left:18px}.sleep .face:after{right:18px}
.sleep .drool{position:absolute;left:54%;top:84%;width:6px;height:12px;border-radius:0 0 6px 6px;background:rgba(150,220,255,.9)}
.sleep .zz{position:absolute;right:16%;top:6%;font-size:20px;color:#fff;font-weight:800;animation:zz 2s ease-in-out infinite}
@keyframes zz{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-8px);opacity:1}}
.coupon{position:relative;margin-top:18px;padding:12px 18px 10px;border-radius:16px;border:2px dashed #ff9ec3;background:rgba(255,255,255,.7);font-family:var(--hand);font-size:23px;line-height:1.2;color:#e0558d;text-align:center;transform:rotate(-3deg);max-width:86%}
.coupon small{display:block;font-size:17px;color:#7a8a99}
.coupon:active{transform:rotate(-3deg) scale(.95)}
.lk-hint{margin-top:auto;margin-bottom:24px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#4f7584;font-size:12.5px;font-weight:700}
.lk-hint .arrow{animation:up 1.4s ease-in-out infinite;font-size:18px}
@keyframes up{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* ===== 홈 ===== */
#home{background:#888}
#home .wall{position:absolute;inset:0;pointer-events:none;z-index:0;filter:grayscale(1) contrast(1.05);
  background:radial-gradient(28% 22% at 38% 42%,#f2f2f2,transparent 70%),radial-gradient(26% 21% at 64% 44%,#e6e6e6,transparent 70%),radial-gradient(45% 35% at 38% 32%,#3a3a3a,transparent 72%),radial-gradient(42% 35% at 66% 34%,#555,transparent 72%),linear-gradient(170deg,#9a9a9a,#cfcfcf 50%,#6f6f6f)}
#home .wall:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,0) 25%,rgba(0,0,0,0) 65%,rgba(0,0,0,.35))}
#home .tear{position:absolute;pointer-events:none;width:5px;height:10px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:rgba(255,255,255,.8);z-index:0}
.home-in{position:relative;z-index:1;flex:1;min-height:0;overflow-y:auto;padding:16px 14px 6px;display:flex;flex-direction:column}
.home-top{display:flex;justify-content:space-between;align-items:flex-end;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.4);padding:4px 6px 14px;width:100%;text-align:left}
.home-top b{font-size:clamp(34px,11vw,44px);font-weight:300;line-height:1}
.home-top span{font-size:12.5px;text-align:right;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 4px;align-content:start}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:84px;padding-top:2px;position:relative}
.app .lbl{font-size:11px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.65);max-width:100%;padding:0 2px;text-align:center;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app.tilt1{transform:rotate(-4deg)}.app.tilt2{transform:rotate(3deg)}
.app.big .ic{box-shadow:0 0 0 3px rgba(255,255,255,.8),0 6px 14px rgba(0,0,0,.25)}
.ic{position:relative;width:56px;height:56px;border-radius:19px;display:flex;align-items:center;justify-content:center;background:var(--c,#fff);color:var(--fc,#2b3440);font-weight:800;font-size:16px;letter-spacing:-.5px;box-shadow:0 4px 10px rgba(0,0,0,.18);overflow:hidden}
.ic:after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.45),rgba(255,255,255,0) 45%);pointer-events:none}
.ic .em{font-size:27px;line-height:1}
.ic .badge{position:absolute;top:-4px;right:-5px;z-index:2;box-shadow:0 0 0 2px #fff}
.dock{position:relative;z-index:1;margin:4px 12px 10px;padding:10px 8px;border-radius:30px;background:rgba(255,255,255,.35);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;grid-template-columns:repeat(4,1fr);justify-items:center;border:1px solid rgba(255,255,255,.5)}
.dock .app{min-height:58px}
.dock .lbl{display:none}

/* ===== 알림 패널 ===== */
.backdrop{position:absolute;inset:0;background:rgba(40,70,80,.35);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.backdrop:active{transform:none!important;opacity:1!important}
.panel-box{position:relative;margin:0 10px;padding:16px;border-radius:0 0 30px 30px;background:rgba(255,255,255,.97);border:1px solid var(--line);border-top:0;max-height:calc(100% - 16px);overflow-y:auto}
.qs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tog{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:76px;font-size:11px;color:var(--sub);text-align:center;line-height:1.25}
.tog .ti{width:52px;height:52px;border-radius:50%;background:#e6f1f4;display:flex;align-items:center;justify-content:center;font-size:20px}
.tog.on .ti{background:linear-gradient(135deg,#8fe3d6,#9fd6f6)}
.tog.on{color:var(--text);font-weight:700}
.noti{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:16px;background:#f3f9fb;margin-top:8px;width:100%;text-align:left;font-size:13px}
.noti b{display:block;font-size:12px;color:var(--mint2)}

/* ===== 토스트 ===== */
#toasts{position:absolute;left:12px;right:12px;bottom:calc(var(--nb) + 14px);z-index:95;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{max-width:100%;padding:10px 16px;border-radius:18px;background:rgba(43,52,64,.94);color:#fff;font-size:13px;line-height:1.5;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .25s ease both;word-break:keep-all;overflow-wrap:anywhere}
.toast.say{width:100%;background:rgba(255,255,255,.98);color:var(--text);border:2px solid var(--pink2)}
.toast.say b{display:block;color:#e0558d;font-size:11.5px;margin-bottom:3px}
.toast.out{animation:tout .3s ease forwards}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(8px)}}

/* ===== 채팅 ===== */
#s-chat .content{padding:10px 10px 14px;background:linear-gradient(180deg,#e7f7fb,#f6eef6)}
.msg{display:flex;gap:7px;margin:3px 0;align-items:flex-end}
.msg.me{justify-content:flex-end}
.msg .av{flex:0 0 38px;width:38px;height:38px;border-radius:15px;align-self:flex-start;font-size:17px}
.msg .av.ghost{visibility:hidden}
.msg .col{display:flex;flex-direction:column;max-width:74%;min-width:0}
.msg .nm{font-size:12px;color:#5d6e7a;margin:2px 0 4px 2px}
.msg .line{display:flex;align-items:flex-end;gap:5px}
.msg.me .line{flex-direction:row-reverse}
.bub{padding:8px 12px;border-radius:16px;font-size:14.5px;line-height:1.45;background:#fff;color:#222;word-break:keep-all;overflow-wrap:anywhere;white-space:pre-wrap;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.msg.them .bub{border-top-left-radius:5px}
.msg.me .bub{background:linear-gradient(135deg,#a8ece3,#b8e2fb);border-top-right-radius:5px}
.msg .tm{flex:0 0 auto;font-size:10.5px;color:#7d8a96;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end}
.msg.them .tm{align-items:flex-start}
.msg .tm .rd{color:#e0a400;font-weight:800}
.sys{margin:12px auto;width:fit-content;max-width:90%;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.7);color:#5d6e7a;font-size:11.5px;text-align:center}
.voice{display:flex;align-items:center;gap:8px;min-width:132px}
.voice .play{width:30px;height:30px;border-radius:50%;background:#fff;color:#e0558d;display:flex;align-items:center;justify-content:center;font-size:11px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.voice .eq{display:flex;gap:2px;align-items:center;height:18px}
.voice .eq i{width:3px;height:6px;border-radius:2px;background:#4f8f95}
.voice.playing .eq i{animation:eq .5s ease-in-out infinite alternate}
.voice.playing .eq i:nth-child(2n){animation-delay:.12s}
@keyframes eq{to{height:18px}}
.emo{font-size:56px;line-height:1;padding:4px 2px;text-align:center}
.emo small{display:block;font-size:10px;color:#5d6e7a;margin-top:2px}
.meme{width:170px;max-width:100%;aspect-ratio:1;border-radius:16px;background:linear-gradient(135deg,#fff3a6,#ffc2da);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:44px;gap:4px}
.meme small{font-size:11px;color:#7a5a66;font-weight:700}
.chatbar{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 8px;background:#fff;border-top:1px solid var(--line)}
.chatbar .fake{flex:1;min-height:40px;border-radius:20px;background:#f1f6f8;color:var(--dim);font-size:13.5px;display:flex;align-items:center;padding:0 14px}
.emodrawer{flex:0 0 auto;display:none;padding:8px 10px 10px;background:#fff;border-top:1px solid var(--line)}
.emodrawer.on{display:block}
.emodrawer .eg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.emodrawer button{min-height:46px;font-size:26px;border-radius:12px;background:#f6fafb}

/* ===== 갤러리 ===== */
.albums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:14px}
.album{text-align:left}
.album .cov{aspect-ratio:1;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:42px;overflow:hidden;position:relative}
.album .an{font-size:14px;font-weight:700;margin-top:7px;line-height:1.3;overflow-wrap:anywhere;word-break:keep-all}
.album .ac{font-size:12px;color:var(--sub)}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;padding:3px}
.thumb{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden}
.thumb .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 5px 4px;font-size:10px;line-height:1.25;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55));text-align:left}
.live{position:absolute;top:5px;left:6px;font-size:9px;font-weight:800;color:#fff;background:rgba(0,0,0,.35);padding:1px 5px;border-radius:6px;letter-spacing:.5px}
.thumb.more{background:#e6f1f4;color:var(--sub);font-size:12px;flex-direction:column;gap:2px}
.blurred{position:relative}

/* ---------- 토스트 ---------- */
function toast(msg, who){
  try{
    var box = document.getElementById("toasts");
    if (!box) return;
    while (box.children.length > 2) box.removeChild(box.firstChild);
    var el = document.createElement("div");
    el.className = "toast" + (who ? " say" : "");
    el.innerHTML = who ? "<b>" + esc(who) + "</b>" + esc(msg) : esc(msg);
    box.appendChild(el);
    var life = who ? 5200 : 2200;
    setTimeout(function(){ el.classList.add("out"); }, life);
    setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, life + 350);
  }catch(e){}
}

/* ---------- 화면 전환 ---------- */
function render(){
  var top = stack[stack.length - 1];
  var vis = {}; vis[top] = true;
  var topEl = document.getElementById(top);
  if (topEl && topEl.classList.contains("overlay") && stack.length > 1) vis[stack[stack.length - 2]] = true;
  $$(".screen").forEach(function(s){
    var i = stack.indexOf(s.id);
    if (vis[s.id]){ s.classList.add("active"); s.style.zIndex = String(10 + i); }
    else { s.classList.remove("active"); s.style.zIndex = "1"; }
  });
  var sb = document.getElementById("statusbar");
  if (sb) sb.classList.toggle("dark", locked || top !== "home" && top !== "s-panel" && top !== "s-recents" && top !== "s-camera" && top !== "s-profile");
}
function openScreen(id){
  if (!document.getElementById(id)) return;
  if (stack[stack.length - 1] === id){ render(); return; }
  var idx = stack.indexOf(id);
  if (idx >= 0) stack = stack.slice(0, idx + 1); else stack.push(id);
  render();
}
function goBack(){ if (locked) return; if (stack.length > 1){ stack.pop(); render(); } }
function goHome(){ if (locked) return; stack = ["home"]; render(); }

  return '<div class="ic" style="--c:' + a.c + ';--fc:' + (a.fc || "#2b3440") + '"><span class="em">' + esc(a.e) + "</span>" + (a.badge ? '<span class="badge">' + esc(a.badge) + "</span>" : "") + "</div>";
}
function appCell(id){
  var a = APPS[id];
  var cls = "app" + (a.big ? " big" : "") + (TILT[id] ? " tilt" + TILT[id] : "");
  return '<button class="' + cls + '" type="button" data-act="app" data-app="' + id + '" aria-label="' + esc(a.n) + '">' + iconHTML(id) + '<span class="lbl">' + esc(a.n) + "</span></button>";
}

  if (a.shop){ fillShop(a.shop); openScreen("s-shop"); return; }

  fillGeneric(id); openScreen("s-generic");
}

}
function lockPhone(){
  stack = ["home"]; locked = true; render();
  var l = document.getElementById("lock"); if (l) l.classList.remove("hidden");
}

/* ---------- 이벤트 ---------- */
function handle(act, el){
  if (locked && act !== "unlock") return;
  var i;
  switch (act){
    case "unlock": unlock(); break;
    case "lock": lockPhone(); break;
    case "back": goBack(); break;
    case "home": goHome(); break;
    case "recents": renderRecents(); stack = ["home"]; openScreen("s-recents"); break;
    case "clearrecent": recentApps = []; renderRecents(); toast("최근 앱을 모두 닫았어요"); break;
    case "panel": if (stack[stack.length - 1] === "s-panel"){ goBack(); break; } renderPanel(); openScreen("s-panel"); break;
    case "open": openScreen(el.getAttribute("data-target")); break;
    case "app": launchApp(el.getAttribute("data-app")); break;
    case "tab": switchTab(el.getAttribute("data-group"), el.getAttribute("data-tab")); break;
    case "wallinfo": toast("배경화면: 226일 프러포즈 날, 울면서 웃던 흑백 셀카 💍"); break;
    case "tog": var k = el.getAttribute("data-k"); toggles[k] = !toggles[k]; renderPanel(); toast((el.textContent || "").trim() + (toggles[k] ? " 켜짐" : " 꺼짐")); break;
    case "clearnoti": notiCleared = true; renderPanel(); toast("알림 모두 지움 🧹"); break;
    case "noti": var nt = NOTIS[Number(el.getAttribute("data-i"))]; if (nt) toast(nt.a + " · " + nt.t); break;
    case "call": var c = CALLS[Number(el.getAttribute("data-i"))]; if (c) openCallDetail(c.n); break;
    case "contact": openCallDetail(el.getAttribute("data-n")); break;
    case "callnow": toast("📞 " + el.getAttribute("data-n") + "에게 거는 중…"); break;
    case "blocked": toast("⊘ 차단된 번호 · " + BLOCK_REASONS[Number(el.getAttribute("data-i"))] + " · 오빠가 차단"); break;
    case "chat": openChat(el.getAttribute("data-chat")); break;
    case "chatinfo": var ch = CHATS[curChat]; toast(ch ? (ch.pinned ? "📌 최상단 고정 채팅방" : ch.openchat ? "익명 오픈채팅 · 153명 · 눈팅만" : ch.title) : "채팅방"); break;
    case "voice":
      el.classList.add("playing"); setTimeout(function(){ el.classList.remove("playing"); }, 1800);
      toast("🔊 " + (el.getAttribute("data-t") || "음성메시지")); break;
    case "emomsg": toast("이모티콘 폭격 중 💥"); break;
    case "meme": toast("밈 짤 🤪"); break;
    case "emotoggle": var dr = document.getElementById("emoDrawer"); if (dr) dr.classList.toggle("on"); break;
    case "emo": toast(el.getAttribute("data-e") + " 보낼까 말까…"); break;
    case "sendfake": toast("오빠한테 보낼 말 고르는 중 💭"); break;
    case "profile": openProfile(el.getAttribute("data-p")); break;
    case "profinfo": toast(el.getAttribute("data-k") === "pic" ? "프로필 사진: 꼬리 물려고 뱅글뱅글 도는 하늘이 움짤" : "상태메시지는 수시로 바뀜 · 지금은 대놓고 자랑 중"); break;
    case "album": openAlbum(el.getAttribute("data-album")); break;
    case "photo": showPhoto(Number(el.getAttribute("data-i")) || 0); openScreen("s-photo"); break;
    case "photonav": showPhoto(curPhoto + Number(el.getAttribute("data-d"))); break;
    case "photolike": if (curAlbum){ var lk = curAlbum.id + curPhoto; liked[lk] = !liked[lk]; showPhoto(curPhoto); toast(liked[lk] ? "❤️ 하트 꾹" : "하트 취소"); } break;
    case "more": toast("나머지 " + (curAlbum ? (curAlbum.c - curAlbum.photos.length).toLocaleString("ko-KR") : "") + "장도 전부 소중함"); break;
    case "memo": openMemo(Number(el.getAttribute("data-i"))); break;
    case "bm": var b = BOOKMARKS[Number(el.getAttribute("data-i"))]; if (b) toast("⭐ " + b.n + " 여는 중…"); break;
    case "search": var s = SEARCHES[Number(el.getAttribute("data-i"))]; if (s){ var q = document.getElementById("q"); if (q) q.value = s; toast("🔍 " + s); } break;
    case "delsearch":
      i = Number(el.getAttribute("data-i")); if (i >= 0 && i < SEARCHES.length){ SEARCHES.splice(i, 1); renderBrowser(); toast("검색어 삭제"); } break;
    case "menusearch": toast("🔍 " + el.getAttribute("data-k") + " 검색 중…"); break;
    case "calev": var ev = EVENTS[Number(el.getAttribute("data-i"))]; if (ev) toast("⏰ " + ev.t + " · " + ev.s); break;
    case "alarmtog": alarm.on = !alarm.on; renderAlarm(); toast(alarm.on ? "오전 7:00 알람 켜짐" : "알람 꺼짐"); break;
    case "snooze":
      alarm.snooze = Math.min(alarm.snooze + 5, 15); renderAlarm();
      toast(alarm.snooze >= 15 ? "15분 뒤… 이제 오빠가 깨우러 옴" : alarm.snooze + "분 뒤로 미룸 😪"); break;
    case "wakeup": alarm.snooze = 0; renderAlarm(); toast("☀️ 결국 오빠가 깨워줌"); break;
    case "musicplay": music = !music; renderMusic(); toast(music ? "▶ 재생 중" : "일시정지"); break;
    case "track": music = true; renderMusic(); toast("▶ " + el.getAttribute("data-t")); break;
    case "shutter":
      var f = document.getElementById("camflash");
      if (f){ f.classList.remove("go"); void f.offsetWidth; f.classList.add("go"); }
      toast("찰칵 📸 라이브 포토 저장"); break;
    case "checkout": toast("결제 직전… 변심 🙃 장바구니로 돌아감"); break;
    case "igpost": var ip = (window.__IG || [])[Number(el.getAttribute("data-i"))]; toast(ip ? ip.n : "게시물"); break;
    default: break;
  }
}
function bind(){
  var phone = document.getElementById("phone");
  if (!phone) return;
  phone.addEventListener("click", function(e){
    var el = e.target.closest("[data-act]");
    if (!el || !phone.contains(el)) return;
    e.preventDefault(); e.stopPropagation();
    try { handle(el.getAttribute("data-act"), el); } catch(err){ if (window.console) console.error(err); }
  });
  var form = document.getElementById("searchForm");
  if (form) form.addEventListener("submit", function(e){
    e.preventDefault();
    var q = document.getElementById("q"); var v = q ? q.value.trim() : "";
    if (!v){ toast("검색어를 입력하세요"); return; }
    var ex = SEARCHES.indexOf(v); if (ex >= 0) SEARCHES.splice(ex, 1);
    SEARCHES.unshift(v); renderBrowser(); toast("🔍 " + v); if (q) q.blur();
  });
  var lock = document.getElementById("lock");
  if (lock){
    var sy = null;
    lock.addEventListener("touchstart", function(e){ sy = e.touches[0].clientY; }, {passive:true});
    lock.addEventListener("touchend", function(e){ if (sy === null) return; var dy = sy - e.changedTouches[0].clientY; sy = null; if (dy > 80) unlock(); }, {passive:true});
  }
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") goBack(); });
}

/* ---------- 시계 (장식) ---------- */
function tick(){
  try{
    var d = new Date(), t = pad(d.getHours()) + ":" + pad(d.getMinutes()), dl = todayLabel();
    ["sbClock","hTime","lkTime","pTime"].forEach(function(id){ setText(id, t); });
    ["hDate","lkDate","pDate"].forEach(function(id){ setText(id, dl); });
  }catch(e){}
}
function initBattery(){
  try{
    var pct = 9 + Math.floor(Math.random() * 12);
    setText("batPct", String(pct)); setText("pBat", pct + "%");
    var f = document.getElementById("batFill"); if (f) f.style.width = Math.max(2, Math.round(pct * 0.18)) + "px";
    NOTIS[4].t = "배터리 " + pct + "% · 충전기를 연결하세요";
    window.__BAT = pct;
  }catch(e){}
}

function init(){
  try { tick(); setInterval(tick, 10000); } catch(e){}
  initBattery();
  buildHome(); renderCalls(); renderAtalk(); renderGallery(); renderMemos(); renderBrowser();
  renderCalendar(); renderAlarm(); renderMusic(); renderInsta(); renderDevice(); renderPanel(); renderRecents();
  render(); bind();
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();
})();
</script>
