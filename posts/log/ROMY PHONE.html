<div id="rm-wrap">
<style>
#rm-wrap{
  --red:#ff3b30; --green:#34c759; --sb:44px; --nb:30px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif;
  --page:#efe9df; --frame:#cfc5b4; --bg:#faf8f5; --bar:#fffdfa; --card:#fff; --line:#e7e0d4; --line2:#f1ece4;
  --text:#1c1c1e; --sub:#8a8276; --acc:#1f3a5f; --accfg:#fff; --chipbg:#efe9df; --chipfg:#4a4338; --press:rgba(0,0,0,.04);
  --avabg:#ece5d9; --navbg:transparent; --navfg:#111; --indicator:#1c1c1e; --panelbg:rgba(250,248,245,.97); --chatbg:#fff;
  --bubMe:#0b84ff; --bubMeText:#fff; --bubThem:#e9e9eb; --bubThemText:#111; --sysbg:#f1ece4; --photobg:#fff; --icr:14px;
}
:where(#rm-wrap) *,:where(#rm-wrap) *::before,:where(#rm-wrap) *::after{box-sizing:border-box;margin:0;padding:0}
#rm-wrap{display:flex;justify-content:center;padding:12px 0;color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;line-height:normal;text-align:left}
:where(#rm-wrap) button{font:inherit;color:inherit;background:none;border:0;margin:0}
:where(#rm-wrap) input{font:inherit;color:inherit}
.tap,[data-act]{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
[data-act]{transition:transform .12s ease,background-color .15s ease,opacity .15s ease}
[data-act]:active{transform:scale(.96);opacity:.82}

/* ===== 기기 프레임 ===== */
#rm-phone{position:relative;container-type:inline-size;width:min(86vw,330px);height:min(calc(min(86vw,330px) * 1.9),78vh);min-height:470px;border-radius:30px;--ir:30px;overflow:hidden;overflow:clip;background:var(--frame);isolation:isolate}
@media (min-width:520px){
  #rm-phone{--ir:33px;width:350px;height:min(700px,88vh);border-radius:42px;border:9px solid var(--frame);background:var(--frame);
    box-shadow:0 0 0 2px rgba(255,255,255,.75),0 0 0 4px rgba(190,180,165,.6),0 28px 60px rgba(90,70,40,.28)}
}
.glass{position:absolute;inset:0;overflow:hidden;border-radius:var(--ir,0px);clip-path:inset(0 round var(--ir,0px));-webkit-clip-path:inset(0 round var(--ir,0px));isolation:isolate;transform:translateZ(0)}
.screen,#rm-xLock,.backdrop{border-radius:var(--ir,0px)}
#rm-xNav{border-radius:0 0 var(--ir,0px) var(--ir,0px)}
.wall{border-radius:var(--ir,0px)}

/* ===== 상태 표시줄 ===== */
#rm-xStatus{position:absolute;top:0;left:0;right:0;height:var(--sb);z-index:90;display:flex;align-items:center;justify-content:space-between;padding:4px 22px 0 30px;font-size:14px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.3)}
#rm-xStatus.dark{color:var(--text);text-shadow:none}
#rm-xStatus .sb-ic{display:flex;align-items:center;gap:6px;pointer-events:none}
#rm-xStatus svg{width:16px;height:16px;fill:currentColor}
#rm-xStatus .bat{display:flex;align-items:center;gap:4px;font-size:12px}
#rm-xStatus .batbox{position:relative;width:25px;height:12px;border:1.5px solid currentColor;border-radius:4px;opacity:.95}
#rm-xStatus .batbox i{position:absolute;left:1.5px;top:1.5px;bottom:1.5px;background:currentColor;border-radius:1.5px}
#rm-xStatus .batbox.low i{background:var(--red)}
#rm-xStatus .batbox:after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;background:currentColor;border-radius:0 1px 1px 0}
#rm-xStatus .lowtxt{color:var(--red)}
#rm-xClock{pointer-events:none}
.island{position:absolute;top:10px;left:50%;width:108px;height:30px;margin-left:-54px;border-radius:18px;background:#000;z-index:91;pointer-events:none}
.punch{position:absolute;top:13px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#050505;z-index:91;pointer-events:none}

/* ===== 하단 바 ===== */
#rm-xNav{position:absolute;left:0;right:0;bottom:0;height:var(--nb);z-index:70;display:flex;justify-content:space-around;align-items:center}
#rm-xNav.android{background:var(--navbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#rm-xNav.android button{width:64px;height:46px;display:flex;align-items:center;justify-content:center;border-radius:14px;color:var(--navfg)}
#rm-xNav.android svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#rm-xNav.ios{background:transparent;pointer-events:none}
#rm-xNav.ios button{pointer-events:auto;width:170px;height:30px;display:flex;align-items:center;justify-content:center}
#rm-xNav.ios button i{width:134px;height:5px;border-radius:3px;background:var(--indicator)}

/* ===== 화면 ===== */
#rm-xScreens{position:absolute;inset:0;z-index:1;overflow:hidden;overflow:clip}
.screen{position:absolute;inset:0;padding:var(--sb) 0 var(--nb);display:flex;flex-direction:column;background:var(--bg);color:var(--text);
  opacity:0;visibility:hidden;pointer-events:none;transform:translateX(26px);
  transition:opacity .22s ease,transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s linear .26s}
.screen.active{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition:opacity .22s ease,transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s}
.screen.overlay{background:transparent;transform:scale(.97)}
.screen.overlay.active{transform:none}
.appbar{flex:0 0 auto;min-height:52px;display:flex;align-items:center;gap:2px;padding:0 6px;border-bottom:1px solid var(--line);background:var(--bar)}
.appbar .ttl{flex:1;min-width:0;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .ttl small{display:block;font-size:11px;font-weight:500;color:var(--sub);margin-top:1px;overflow:hidden;text-overflow:ellipsis}
.back{display:flex;align-items:center;gap:0;min-width:44px;height:44px;padding:0 8px 0 2px;border-radius:12px;color:var(--acc);font-size:16px}
.back svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ibtn{width:44px;height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--acc)}
.ibtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.content{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.content::-webkit-scrollbar{width:0}
.sec{padding:16px 16px 6px;font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.02em}
.row{display:flex;align-items:center;gap:12px;min-height:58px;padding:9px 16px;width:100%;text-align:left;border-bottom:1px solid var(--line2)}
.row:active{background:var(--press)}
.row .mid{flex:1;min-width:0}
.row .t1{font-size:15px;font-weight:600;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
.row .t2{display:block;font-size:12.5px;color:var(--sub);margin-top:2px;line-height:1.45;overflow-wrap:anywhere;word-break:keep-all}
.row .t2.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{flex:0 0 auto;font-size:11.5px;color:var(--sub);text-align:right;max-width:34%;line-height:1.5}
.ava{position:relative;flex:0 0 auto;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:21px;background:var(--avabg);color:var(--text);overflow:hidden}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:700;line-height:1}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;background:var(--chipbg);color:var(--chipfg)}
.card{margin:10px 14px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.empty{padding:24px 20px;text-align:center;color:var(--sub);font-size:13px;line-height:1.6;word-break:keep-all}
.tabs{flex:0 0 auto;display:flex;border-bottom:1px solid var(--line);background:var(--bar)}
.tabs button{flex:1;min-height:44px;font-size:14px;font-weight:600;color:var(--sub);border-bottom:2px solid transparent}
.tabs button.on{color:var(--acc);border-color:var(--acc)}
.pane{display:none}.pane.on{display:block}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--sub);flex:0 0 auto;max-width:40%}
.kv span:last-child{text-align:right;overflow-wrap:anywhere;word-break:keep-all}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:14px;background:var(--acc);color:var(--accfg);font-size:14px;font-weight:700}
.btn.ghost{background:var(--chipbg);color:var(--text)}
.btn.full{width:100%}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--acc)}
.note-s{font-size:11.5px;color:var(--sub);margin-top:4px;line-height:1.5;word-break:keep-all}

/* ===== 사진 아트 (CSS로 그린 사진) ===== */
.art{position:relative;overflow:hidden}
.art .em{position:absolute;transform:translate(-50%,-50%);line-height:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.18))}
.art.gray{filter:grayscale(1)}
.art.soft:after{content:"";position:absolute;inset:0;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);background:rgba(20,10,20,.18);pointer-events:none}
.art.shake .em{filter:blur(1.5px)}

/* ===== 잠금화면 ===== */
#rm-xLock{position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;transition:opacity .35s ease,visibility 0s linear 0s;overflow:hidden}
#rm-xLock.hidden{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .35s ease,visibility 0s linear .35s}
#rm-xLock .lart{position:absolute;inset:0;pointer-events:none}
#rm-xLock .lk-clock{position:relative;z-index:2;margin-top:calc(var(--sb) + 18px);text-align:center;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.35);pointer-events:none}
#rm-xLock .lk-clock span{display:block;font-size:15px;font-weight:600}
#rm-xLock .lk-clock b{display:block;font-size:clamp(60px,21cqw,86px);font-weight:600;letter-spacing:-2px;line-height:1.05}
#rm-xLock.ios .lk-clock b{font-weight:700}
#rm-xLock .tapzone{position:absolute;inset:0;z-index:1}
#rm-xLock .tapzone:active{transform:none;opacity:1}
.lk-bottom{position:relative;z-index:3;margin-top:auto;margin-bottom:calc(var(--nb) + 12px);display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5);font-size:13px;font-weight:600;padding:0 16px;text-align:center}
.unlockbtn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:24px;background:rgba(255,255,255,.18);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.3);color:#fff}
.lk-cap{position:relative;z-index:3;margin-top:10px;max-width:86%;padding:5px 12px;border-radius:12px;background:rgba(0,0,0,.28);color:#fff;font-size:11.5px;line-height:1.45;text-align:center;word-break:keep-all;pointer-events:none}

/* ===== 홈 ===== */
#rm-xHome{background:#000}
#rm-xHome .wall{position:absolute;inset:0;pointer-events:none;z-index:0}
#rm-xHome .wall:after,#rm-xLock .lart:after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(180deg,rgba(0,0,0,.34),rgba(0,0,0,.08) 22%,rgba(0,0,0,0) 40%,rgba(0,0,0,0) 72%,rgba(0,0,0,.28))}
#rm-xPages{position:relative;z-index:1;flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#rm-xPages::-webkit-scrollbar{display:none}
.hpage{flex:0 0 100%;width:100%;scroll-snap-align:start;padding:12px 14px 6px;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:12px}
.hpage::-webkit-scrollbar{width:0}
.wgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.widget{position:relative;border-radius:22px;padding:14px;min-height:96px;text-align:left;color:#fff;background:rgba(30,30,34,.38);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.14);overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;text-shadow:0 1px 3px rgba(0,0,0,.25)}
.widget.wide{grid-column:1/-1}
.widget .w1{font-size:12px;font-weight:600;opacity:.9}
.widget .w2{font-size:clamp(24px,8cqw,34px);font-weight:600;line-height:1.05;letter-spacing:-.5px}
.widget .w3{font-size:12px;opacity:.88;line-height:1.4;word-break:keep-all}
.widget.photo{padding:0;min-height:140px}
.widget.photo .art{position:absolute;inset:0}
.widget.photo .w3{position:absolute;left:10px;right:10px;bottom:8px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 4px;align-content:start}
.app{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;min-height:80px;padding-top:2px}
.app .lbl{font-size:11px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);max-width:100%;padding:0 2px;text-align:center;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{position:relative;width:58px;height:58px;border-radius:var(--icr);display:flex;align-items:center;justify-content:center;background:var(--c,#fff);color:var(--fc,#111);font-weight:800;font-size:16px;letter-spacing:-.4px;box-shadow:0 3px 8px rgba(0,0,0,.18)}
.ic .e{font-size:28px;line-height:1}
.ic .badge{position:absolute;top:-5px;right:-7px;z-index:2}
.fold{background:rgba(255,255,255,.22);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:8px}
.fold .mini{width:100%;aspect-ratio:1;border-radius:5px;font-size:9px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--c,#fff)}
.dots{position:relative;z-index:1;display:flex;justify-content:center;gap:0;padding:0}
.dots button{width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.dots button i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45);transition:all .2s}
.dots button.on i{background:#fff}
.dock{position:relative;z-index:1;margin:2px 10px 8px;padding:10px 8px;border-radius:30px;background:rgba(255,255,255,.18);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:grid;grid-template-columns:repeat(4,1fr);justify-items:center}
.dock .app{min-height:60px}
.dock .lbl{display:none}

/* ===== 오버레이 ===== */
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.backdrop:active{transform:none!important;opacity:1!important}
.ov-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;position:relative;pointer-events:none}
.ov-box{pointer-events:auto;position:relative;margin:auto 16px;padding:18px 12px 12px;border-radius:30px;background:rgba(60,60,66,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12);max-height:82%;overflow-y:auto;color:#fff}
.ov-box h3{text-align:center;font-size:19px;font-weight:600;margin-bottom:14px}
.panel-box{position:relative;margin:0 10px;padding:16px;border-radius:0 0 28px 28px;background:var(--panelbg);color:var(--text);border:1px solid var(--line);border-top:0;max-height:calc(100% - 12px);overflow-y:auto}
.qs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tog{display:flex;flex-direction:column;align-items:center;gap:5px;min-height:74px;font-size:11px;color:var(--sub);text-align:center;line-height:1.25}
.tog .ti{width:50px;height:50px;border-radius:50%;background:var(--chipbg);display:flex;align-items:center;justify-content:center;font-size:19px}
.tog.on .ti{background:var(--acc);color:var(--accfg)}
.tog.on{color:var(--text);font-weight:600}

/* ===== 토스트 ===== */
#rm-xToasts{position:absolute;left:12px;right:12px;bottom:calc(var(--nb) + 12px);z-index:95;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{max-width:100%;padding:10px 16px;border-radius:16px;background:rgba(30,30,34,.94);color:#fff;font-size:13px;line-height:1.5;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:tin .25s ease both;word-break:keep-all;overflow-wrap:anywhere}
.toast.out{animation:tout .3s ease forwards}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(8px)}}

/* ===== 채팅 ===== */
.chatwrap{background:var(--chatbg)}
#rm-xChatBody{padding:10px 10px 12px;background:var(--chatbg)}
.msg{display:flex;gap:7px;margin:3px 0;align-items:flex-end}
.msg.me{justify-content:flex-end}
.msg .av{flex:0 0 32px;width:32px;height:32px;font-size:15px;align-self:flex-end}
.msg .av.ghost{visibility:hidden}
.msg .col{display:flex;flex-direction:column;max-width:76%;min-width:0}
.msg.me .col{align-items:flex-end}
.msg .nm{font-size:11.5px;color:var(--sub);margin:2px 0 3px 4px}
.bub{padding:8px 12px;border-radius:18px;font-size:14.5px;line-height:1.42;background:var(--bubThem);color:var(--bubThemText);word-break:keep-all;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.me .bub{background:var(--bubMe);color:var(--bubMeText)}
.msg .tm{font-size:10.5px;color:var(--sub);margin:2px 4px 0}
.sys{margin:12px auto;width:fit-content;max-width:90%;padding:4px 12px;border-radius:999px;background:var(--sysbg);color:var(--sub);font-size:11.5px;text-align:center;word-break:keep-all}
.stk{font-size:56px;line-height:1;padding:2px;text-align:center}
.stk small{display:block;font-size:10.5px;color:var(--sub);margin-top:3px;max-width:150px;word-break:keep-all}
.pbub{width:180px;max-width:100%;border-radius:16px;overflow:hidden;background:var(--card)}
.pbub .art{height:130px}
.pbub small{display:block;padding:6px 9px 8px;font-size:11.5px;color:var(--sub);line-height:1.4;word-break:keep-all}
.voice{display:flex;align-items:center;gap:8px;min-width:140px}
.voice .pl{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.85);color:#222;display:flex;align-items:center;justify-content:center;font-size:10px}
.voice .eq{display:flex;gap:2px;align-items:center;height:18px}
.voice .eq i{width:3px;height:6px;border-radius:2px;background:currentColor;opacity:.7}
.voice.playing .eq i{animation:eq .5s ease-in-out infinite alternate}
.voice.playing .eq i:nth-child(2n){animation-delay:.12s}
@keyframes eq{to{height:18px}}
.file{display:flex;align-items:center;gap:10px;min-width:160px}
.file .fi{width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-size:18px}
.chatbar{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--bar);border-top:1px solid var(--line)}
.chatbar .fake{flex:1;min-height:38px;border-radius:19px;border:1px solid var(--line);color:var(--sub);font-size:13.5px;display:flex;align-items:center;padding:0 14px}
.emodrawer{flex:0 0 auto;display:none;padding:8px 10px 10px;background:var(--bar);border-top:1px solid var(--line)}
.emodrawer.on{display:block}
.emodrawer .eg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.emodrawer button{min-height:44px;font-size:25px;border-radius:12px;background:var(--chipbg)}

/* ===== 갤러리 ===== */
.albums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:14px}
.album{text-align:left;min-width:0}
.album .art{aspect-ratio:1;border-radius:14px}
.album .an{font-size:14px;font-weight:600;margin-top:6px;line-height:1.3;overflow-wrap:anywhere;word-break:keep-all}
.album .ac{font-size:12px;color:var(--sub);line-height:1.35;word-break:keep-all}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;padding:2px}
.thumb{position:relative;aspect-ratio:1;overflow:hidden;display:block}
.thumb .art{position:absolute;inset:0}
.thumb .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 5px 4px;font-size:10px;line-height:1.25;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6));text-align:left;z-index:2;word-break:keep-all}

var WIDGETS = [];

var BR = null;
function fillBrowser(a){

    return '<div class="row" role="button" data-act="search" data-i="' + i + '"><span class="ava" style="width:34px;height:34px;font-size:14px">🔍</span><span class="mid"><span class="t1" style="font-weight:500;font-size:14px">' + esc(s.q) + "</span>" + (s.note ? '<span class="t2">' + esc(s.note) + "</span>" : "") + '</span><button class="ibtn" type="button" data-act="delsearch" data-i="' + i + '" aria-label="삭제"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>';

var AL = null;
function fillAlarm(a){
  AL = a;
  bar("rm-xBarAlarm", esc(a.n));
  setHTML("rm-xAlarm", '<div class="sec">알람</div>' + a.alarms.map(function(x, i){
    return '<div class="alarmrow' + (x.on ? "" : " off") + '"><div class="mid"><div class="at">' + esc(x.t) + '</div><span class="t2" style="display:block;font-size:13px;color:var(--sub)">' + esc(x.label) + (x.rep ? " · " + esc(x.rep) : "") + "</span>" + (x.note ? '<span class="chip" style="margin-top:5px">' + esc(x.note) + "</span>" : "") + '</div><button class="swbtn" type="button" data-act="alarmtog" data-i="' + i + '" aria-label="알람 켜기/끄기"><span class="sw' + (x.on ? " on" : "") + '"></span></button></div>';
  }).join(""));
}
var MU = null, playing = -1;
function fillMusic(a){
  MU = a;
  bar("rm-xBarMusic", esc(a.n));
  var t = a.tracks[playing >= 0 ? playing : 0];
  var h = '<div class="nowplay">' + artHTML({e: playing >= 0 ? "🎶" : "🎧", g: a.g || "night", size: 60}) + "<h3>" + esc(t.t) + "</h3><p>" + esc(t.a) + '</p><div class="ctrls"><button type="button" data-act="mprev" aria-label="이전 곡">⏮</button><button type="button" class="main" data-act="mplay" aria-label="재생">' + (playing >= 0 ? "❚❚" : "▶") + '</button><button type="button" data-act="mnext" aria-label="다음 곡">⏭</button></div></div>';
  h += '<div class="sec">' + esc(a.label || "최근 재생") + "</div>" + a.tracks.map(function(x, i){
    return '<button class="row" type="button" data-act="track" data-i="' + i + '"><span class="ava" style="border-radius:8px;background:' + bgOf(x.g || a.g || "night") + '">' + (playing === i ? "🔊" : "♪") + '</span><span class="mid"><span class="t1">' + esc(x.t) + '</span><span class="t2">' + esc(x.a) + "</span></span></button>";
  }).join("") + (a.foot ? '<div class="empty">' + esc(a.foot) + "</div>" : "");

/* ---------- 제어 센터 ---------- */
var TOG = [];
function buildPanel(){
  var p = P.panel || {};
  if (!TOG.length) TOG = (p.toggles || []).map(function(t){ return {n:t[0], ic:t[1], on:!!t[2]}; });
  var h = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div><div style="font-size:26px;font-weight:300" class="pclock">--:--</div><div style="font-size:12px;color:var(--sub)" class="pdate"></div></div><button class="ibtn" data-act="lock" aria-label="화면 잠금" type="button"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button></div>';
  h += '<div class="qs">' + TOG.map(function(t, i){ return '<button class="tog' + (t.on ? " on" : "") + '" type="button" data-act="tog" data-i="' + i + '"><span class="ti">' + esc(t.ic) + "</span>" + esc(t.n) + "</button>"; }).join("") + "</div>";
  h += '<div class="card" style="margin:14px 0 10px"><div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600"><span>배터리</span><span style="color:' + (P.__bat <= 20 ? "var(--red)" : "var(--text)") + '">' + P.__bat + "%</span></div>" + (p.battery ? '<div class="note-s">' + esc(p.battery) + "</div>" : "") + "</div>";
  if (p.storage) h += '<div class="card" style="margin:0 0 10px"><div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600"><span>저장 공간</span><span style="color:var(--sub)">' + esc(p.storage.label) + '</span></div><div class="bar"><i style="width:' + p.storage.pct + '%"></i></div>' + (p.storage.note ? '<div class="note-s">' + esc(p.storage.note) + "</div>" : "") + "</div>";
  if (p.allow) h += '<div class="card" style="margin:0 0 10px"><div style="font-size:12px;color:var(--sub)">' + esc(p.allowLabel || "알림 허용") + '</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">' + p.allow.map(function(x){ return '<span class="chip">' + esc(x) + "</span>"; }).join("") + "</div>" + (p.allowNote ? '<div class="note-s">' + esc(p.allowNote) + "</div>" : "") + "</div>";
  h += '<button class="btn full" data-act="device" type="button">휴대전화 정보</button>';
  setHTML("rm-xPanel", h);
  tick();
}
function buildDevice(){
  bar("rm-xBarDevice", "휴대전화 정보");
  setHTML("rm-xDevice", '<div class="card">' + (P.device || []).map(function(r){ return '<div class="kv"><span>' + esc(r[0]) + "</span><span>" + esc(r[1]) + "</span></div>"; }).join("") + "</div>");
}
function renderRecents(){
  setHTML("rm-xRecent", recentApps.length ? recentApps.map(function(id){
    return '<button class="row" type="button" data-act="app" data-app="' + esc(id) + '" style="border-radius:16px;background:rgba(255,255,255,.12);margin-bottom:8px;color:#fff;border:0">' + icon(id) + '<span class="mid"><span class="t1">' + esc(P.apps[id].n) + "</span></span></button>";
  }).join("") : '<div class="empty" style="color:#ddd">최근 실행한 앱이 없어요</div>');
}
function switchTab(g, t){
  $$('[data-act="tab"][data-group="' + g + '"]').forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-tab") === t); });
  $$('.pane[data-group="' + g + '"]').forEach(function(p){ p.classList.toggle("on", p.getAttribute("data-pane") === t); });
}

/* ---------- 이벤트 ---------- */
function handle(act, e){
  if (locked && act !== "unlock" && act !== "locktap") return;
  var i = Number(e.getAttribute("data-i")), x;
  switch (act){
    case "locktap": toast(P.lock.tap || "📷 잠금화면 사진"); break;
    case "unlock": unlock(); break;
    case "lock": lockPhone(); break;
    case "back": goBack(); break;
    case "home": goHome(); break;
    case "recents": renderRecents(); stack = ["rm-xHome"]; openScreen("rm-s-recents"); break;
    case "clearrecent": recentApps = []; renderRecents(); toast("최근 앱을 모두 닫았어요"); break;
    case "panel": if (stack[stack.length - 1] === "rm-s-panel"){ goBack(); break; } buildPanel(); openScreen("rm-s-panel"); break;
    case "device": buildDevice(); openScreen("rm-s-device"); break;
    case "tog": x = TOG[i]; if (x){ x.on = !x.on; buildPanel(); toast(x.n + (x.on ? " 켜짐" : " 꺼짐")); } break;
    case "page": scrollToPage(i = Number(e.getAttribute("data-page")) || 0); break;
    case "widget": x = WIDGETS[i]; if (x){ if (x.open && P.apps[x.open]) launchApp(x.open); else toast(x.tip || x.caption || "위젯"); } break;
    case "app": launchApp(e.getAttribute("data-app")); break;
    case "folder": openFolder(e.getAttribute("data-folder")); break;
    case "tab": switchTab(e.getAttribute("data-group"), e.getAttribute("data-tab")); break;
    case "lrow": x = LIST && LIST.sections[Number(e.getAttribute("data-s"))]; x = x && x.rows[Number(e.getAttribute("data-r"))]; if (x) toast(x.tip || ((x.e ? x.e + " " : "") + x.t)); break;
    case "call": x = (P.apps[curApp].calls || [])[i]; if (x) openCallDetail(x.n); break;
    case "contact": x = (P.__names || [])[i]; if (x) openCallDetail(x); break;
    case "callnow": toast("📞 " + e.getAttribute("data-n") + " 연결 중…"); break;
    case "chatfrom":
      var ca = null; Object.keys(P.apps).forEach(function(k){ if (P.apps[k].type === "chat") ca = ca || P.apps[k]; });
      if (ca){ fillChats(ca); var key = e.getAttribute("data-chat"); var idx = -1; ca.chats.forEach(function(c, j){ if (c.key === key) idx = j; }); if (idx >= 0) openChat(idx); }
      break;
    case "chat": openChat(i); break;
    case "profile": openProfile(); break;
    case "mtap": toast(e.getAttribute("data-msg")); break;
    case "voice": e.classList.add("playing"); setTimeout(function(){ e.classList.remove("playing"); }, 1600); toast("🔊 " + e.getAttribute("data-msg")); break;
    case "emotoggle": x = el("rm-xEmo"); if (x) x.classList.toggle("on"); break;
    case "emo": toast(e.getAttribute("data-e") + " 보내기 (미리보기)"); break;
    case "sendfake": toast(P.sendTip || "보낼 말 고르는 중…"); break;
    case "album": openAlbum(e.getAttribute("data-id"), false); break;
    case "subalbum": openAlbum(e.getAttribute("data-id"), true); break;
    case "unlockalb":
      unlockedAlb[e.getAttribute("data-id")] = true;
      var tgt = e.getAttribute("data-target"), al2 = findAlbum(e.getAttribute("data-id"));
      toast(IOS ? "Face ID 확인됨" : "지문 확인됨");
      setHTML(tgt === "rm-s-subalbum" ? "rm-xSub" : "rm-xAlb", albumBody(al2, tgt));
      curAlbum = al2; albumCtx[tgt] = al2;
      break;
    case "photo":
      var top = stack[stack.length - 1]; curAlbum = albumCtx[top] || curAlbum;
      showPhoto(i); openScreen("rm-s-photo"); break;
    case "photonav": showPhoto(curPhoto + Number(e.getAttribute("data-d"))); break;
    case "like": if (curAlbum){ var k2 = curAlbum.id + ":" + curPhoto; liked[k2] = !liked[k2]; showPhoto(curPhoto); toast(liked[k2] ? "♥ 즐겨찾기" : "즐겨찾기 해제"); } break;
    case "more": toast(e.getAttribute("data-msg")); break;
    case "note": openNote(i); break;
    case "bm": toast("⭐ " + BR.bookmarks[i] + " 여는 중…"); break;
    case "tabitem": toast("🗂 " + BR.tabs.list[i]); break;
    case "search": x = BR.searches[i]; if (x){ var q = el("rm-xQ"); if (q) q.value = x.q; toast("🔍 " + x.q); } break;
    case "delsearch": if (BR.searches[i]){ BR.searches.splice(i, 1); renderSearches(); toast("검색어 삭제됨"); } break;
    case "alarmtog": x = AL.alarms[i]; if (x){ x.on = !x.on; fillAlarm(AL); toast(x.t + " " + x.label + (x.on ? " · 켜짐" : " · 꺼짐")); } break;
    case "mplay": playing = playing >= 0 ? -1 : 0; fillMusic(MU); toast(playing >= 0 ? "▶ " + MU.tracks[0].t : "일시정지"); break;
    case "mnext": playing = ((playing < 0 ? 0 : playing) + 1) % MU.tracks.length; fillMusic(MU); toast("▶ " + MU.tracks[playing].t); break;
    case "mprev": playing = ((playing < 0 ? 0 : playing) - 1 + MU.tracks.length) % MU.tracks.length; fillMusic(MU); toast("▶ " + MU.tracks[playing].t); break;
    case "track": playing = i; fillMusic(MU); toast("▶ " + MU.tracks[i].t + " — " + MU.tracks[i].a); break;
    case "shutter": x = el("rm-xFlash"); if (x){ x.classList.remove("go"); void x.offsetWidth; x.classList.add("go"); } toast(P.shutterTip || "찰칵 📸"); break;
    default: break;
  }
}
function bind(){
  var ph = root();
  ph.addEventListener("click", function(ev){
    var t = ev.target.closest("[data-act]");
    if (!t || !ph.contains(t)) return;
    if (t.tagName === "BUTTON" && t.type === "submit") return;
    ev.preventDefault(); ev.stopPropagation();
    try { handle(t.getAttribute("data-act"), t); } catch(err){ if (window.console) console.error(err); }
  });
  ph.addEventListener("submit", function(ev){
    var f = ev.target; if (!f || f.getAttribute("data-form") !== "search") return;
    ev.preventDefault();
    var q = el("rm-xQ"), v = q ? q.value.trim() : "";
    if (!v){ toast("검색어를 입력하세요"); return; }
    BR.searches.unshift({q: v}); renderSearches(); toast("🔍 " + v); if (q) q.blur();
  });
  var pages = el("rm-xPages");
  if (pages){ var tk = false; pages.addEventListener("scroll", function(){ if (tk) return; tk = true; requestAnimationFrame(function(){ tk = false; updateDots(curPage()); }); }, {passive:true}); }
  var lk = el("rm-xLock");
  if (lk){
    var sy = null;
    lk.addEventListener("touchstart", function(ev){ sy = ev.touches[0].clientY; }, {passive:true});
    lk.addEventListener("touchend", function(ev){ if (sy === null) return; var dy = sy - ev.changedTouches[0].clientY; sy = null; if (dy > 70) unlock(); }, {passive:true});
  }
}

/* ---------- 시계 (장식) ---------- */
function tick(){
  try{
    var d = new Date(), t = pad(d.getHours()) + ":" + pad(d.getMinutes()), dl = dateLabel();
    setText("rm-xClock", t); setText("rm-xLkTime", t); setText("rm-xLkDate", dl);
    $$(".wclock, .pclock").forEach(function(x){ x.textContent = t; });
    $$(".wdate, .pdate").forEach(function(x){ x.textContent = dl; });
    $$(".wday").forEach(function(x){ x.textContent = DAYS[d.getDay()] + "요일"; });
    $$(".wdnum").forEach(function(x){ x.textContent = String(d.getDate()); });
    var h = d.getHours();
    $$(".wwx").forEach(function(x){ x.textContent = h >= 6 && h < 18 ? "⛅" : "☁"; });
  }catch(e){}
}

function init(){
  try { buildStatus(); } catch(e){}
  buildLock(); buildHome(); buildPanel(); buildDevice(); renderRecents();
  try { tick(); setInterval(tick, 10000); } catch(e){}
  render(); bind();
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();
})();
</script>
